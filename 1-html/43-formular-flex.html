<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox - Kontaktformular</title>
  <style>
    /* === Grundformatierung === */
    html,
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      min-width: 320px;
      padding: 1rem;
      margin: auto;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }

    /* Basisformatierung des Formulars*/
    form {
      max-width: 500px;
    }

    form>div {
      margin-bottom: 1em;
    }

    /* Zentrale Formatierung der Formular-Elemente */
    input,
    textarea,
    button {
      font-size: 1.1rem;
      padding: 0.25rem 0.75rem;
      border: none;
      margin: 0;
    }

    input,
    textarea {
      background: #e9e9e9;
    }

    input:focus,
    textarea:focus {
      outline: none;
    }

    button {
      text-align: center;
      background: #000;
      color: #fff;
      cursor: pointer;
    }

    button:hover,
    button:focus {
      background: darkorange;
      color: #000;
    }

    /* Flex it */
    form>div {
      display: flex;
      flex-wrap: wrap;
    }

    label {
      flex: 0 8rem;

    }

    input,
    textarea,
    {
    flex: 1;
    }

    button {
      flex: 1;
      margin-left: auto;
    }
  </style>
</head>

<body>
  <h1>Flexbox - Kontaktformular</h1>

  <form action="" class="kontaktform">
    <div>
      <label for="username">Ihr Name:</label>
      <input type="text" name="username" id="username">
    </div>

    <div>
      <label for="usermail">Ihre Mailadresse:</label>
      <input type="email" name="usermail" id="usermail">
    </div>

    <div>
      <label for="nachricht">Ihre Nachricht:</label>
      <textarea name="nachricht" id="nachricht" cols="30" rows="10"></textarea>
    </div>

    <div>
      <button type="submit">Abschicken</button>
    </div>

  </form>
</body>

</html>
