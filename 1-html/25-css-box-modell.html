<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Das CSS-Box-Modell</title>
  <style>
    div {
      width: 400px;
      height: 200px;
      background-color: #fed136;
      padding: 10px;
      border: 5px solid darkolivegreen;
    }
  </style>
</head>
<body>
  <h1>Das CSS-Box-Modell</h1>

  <h2>Standard: <code>box-sizing: content-box;</code></h2>

  <div id="contentBox"></div>

  <h2>Alternative: <code>box-sizing: border-box;</code></h2>

  <div id="borderBox"></div>
</body>
</html>
