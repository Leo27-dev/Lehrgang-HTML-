<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shorthand - CSS in kurz</title>
  <style>
    /* Bestimmte Eigenschaften können an Nachfahrer vererbt werden */
    body {
      font-family: arial;
      color: blue;
      font-size: 20px;
    }

    h1 {
      /* rahmen an der unterseite der browswer benötigt mindestens 2 meist 3 eigenschaften */
      border-bottom-width: 5px;
      border-bottom-style: solid;
      border-bottom-color: black;


    }

    h2 {
      border-bottom: 5px solid darkblue;
    }
  </style>
</head>

<body>
  <h1>Shorthand - CSS in kurz</h1>

  <h2>Eine Überschrift</h2>

  <p>Ein Absatz, welcher die CSS-Definition direkt am HTML-Tag enthält.</p>

  <p>Noch ein Absatz mit Standard-Einstellungen.</p>
</body>

</html>
