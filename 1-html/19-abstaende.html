<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abstände und Shorthand</title>
  <style>
    div { height: 70px; }
    #eins { background-color: #ac0035;
    margin-bottom: 15px; }

    #zwei {
      background-color: #ed9c53;
      /* ? === Außenabstände überlappen sich === */

      margin-top: 10px;
      /* ? === Shorthand für margin (gibt es esbenso für padding) === */
      /* 1) 
      alle seiten gleich */
      margin: 20;

      /* 2) 
      wert 1 vertikaler, 
      wert 2 hochizontal abstand*/
      margin: 20px 40px;

      /* 3) 
      wert 1: oberer abstand
      wert 2: hochizontaler abstand
      wert 3: unterer abstand 
      */
      margin: 20px 40px 50px;

      /* 4)
      wert 1: oberer abstand
      folgende werte im uhrzeigersinn 
       */
       margin: 20px 30px 40px 50px;

       /* vertikale Abstände */
       margin-block: 30px 50px;

       /* hochizontale Abstände
       wert 1: Start , Wert 2: Ende */
      margin-inline: 20px 30px ;
    }

    #drei { background-color: #cccca5; }
  </style>
</head>
<body>
  <h1>Abstände und Shorthand</h1>

  <div id="eins"></div>
  <div id="zwei"></div>
  <div id="drei"></div>
</body>
</html>
