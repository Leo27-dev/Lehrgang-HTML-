<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klassen- und ID-Selektoren</title>
  <style>
    body {
      font-family: sans-serif;
      color: darkgreen;
    }

    /* Klassen-Selektoren */
    .haupt-farbe {
      color: red;
    }

    .gross {
      font-size: 200%;
    }

    /* Id-Selektoren */
    #rom {
      color: blue;
    }

    #einzug {
      text-indent: 80pxZ;
    }
  </style>

<body>
  <h1>Weitere Selektoren</h1>

  <h2>Klassen- und ID-Selektoren</h2>

  <h3 class="haupt-farbe">Klassen-Selektoren</h3>

  <p class="gross">Dies ist eine große Schrift.</p>

  <p class="gross haupt-farbe">Dies ist eine große, rote Schrift.</p>

  <h3>ID-Selektoren</h3>

  <p id="rom">Alle Wege führen nach Rom.</p>

  <p>Aber unter Umständen auch nach Nordhausen.</p>

  <h3>Gemischt</h3>

  <p id="einzug" class="haupt-farbe">Nochmal irgend etwas gemischtes.</p>
</body>

</html>
