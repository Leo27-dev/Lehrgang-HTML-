<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beispiel: CSS Grid Gallery mit grid-auto-rows</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f4f4f4;
      color: #222;
      line-height: 1.5;
    }

    main {
      width: min(1000px, 92%);
      margin: 40px auto;
    }

    h1,
    p {
      margin-bottom: 1rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-auto-rows: 80px;
      grid-auto-flow: dense;
      gap: 10px;
      padding: 10px;
      background: #ddd;
      border: 2px solid #aaa;
    }

    .item {
      display: grid;
      place-items: center;
      padding: 1rem;
      background: #5b8def;
      color: white;
      font-weight: 700;
      border-radius: 8px;
    }

    .wide {
      grid-column: span 2;
      background: #3f6fd8;
    }

    .tall {
      grid-row: span 2;
      background: #27a36a;
    }

    .big {
      grid-column: span 2;
      grid-row: span 2;
      background: #d86b3f;
    }

  
  </style>
</head>
<body>
  <main>
    <h1>CSS Grid Gallery: automatische Zeilenhöhe</h1>

    <p>
      In diesem Beispiel entstehen die Zeilen automatisch. Deshalb wird die Zeilenhöhe nicht mit
      <code>grid-template-rows</code>, sondern mit <code>grid-auto-rows</code> festgelegt.
    </p>

    <article class="gallery">
      <div class="item">1</div>
      <div class="item wide">2 wide</div>
      <div class="item">3</div>
      <div class="item tall">4 tall</div>
      <div class="item">5</div>
      <div class="item big">6 big</div>
      <div class="item">7</div>
      <div class="item wide">8 wide</div>
      <div class="item">9</div>
      <div class="item tall">10 tall</div>
      <div class="item">11</div>
      <div class="item">12</div>
      <div class="item wide">13 wide</div>
      <div class="item">14</div>
      <div class="item">15</div>
    </article>
  </main>
</body>
</html>
