<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundwerk</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<header>
    <nav>
        <ul>
            <li><a href="index.html">Startseite</a></li>
            <li><a href="services.html">Services</a></li>
        </ul>
    </nav>
</header>


<body>
    <main>


        <address> <!-- auf zb Pfadangaben, Email etc-->
            <h2>Kontaktdaten</h2>
            <p>Soundwerk Studio</p>
            Musterstraße 12 <br>
            998804 <br>
            Telefone: 0361 1234567 <br>
            E-Mail: info@soundwerk.de
        </address>
        <form class="contact-form" action="" method="post">
            <div class="form-group">
                <label for="vname">Vorname</label><br>
                <input type="text" name="vname" id="vname" required><br>

                <label for="email">E-Mail</label><br>
                <input type="email" name="email" id="email" required><br>
            </div>

            <div class="form-group">
                <label for="service">Interesse an</label>
                <select name="service" id="service">
                    <option value="proberaum">Proberaum</option>
                    <option value="aufnahme">Aufnahme</option>
                    <option value="coaching">Coaching</option>
                </select>
            </div>

            <div class="form-button">
                <label for="message">Nachricht</label><br>
                <textarea name="message" id="message" required rows="6"></textarea><br>
                <button type="submit">Absenden</button>
            </div>
        </form>


    </main>
</body>

</html>
